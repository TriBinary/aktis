name: Feature request
description: Suggest an idea for Aktis
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Assets / resource packs, World loading, Scene, Path tracer, Shader packs, UI, Animation, Other]
