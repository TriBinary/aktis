name: Bug report
description: Something renders wrong, crashes or misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead. Screenshots or renders help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aktis version
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Other]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: e.g. Apple M5 Max, NVIDIA RTX 4070
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version of the world / client jar
  - type: input
    id: packs
    attributes:
      label: Resource packs / shader pack used
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with RUST_LOG=aktis=debug and paste the relevant output.
      render: text
