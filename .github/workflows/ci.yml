name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Clippy & test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs build
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  docs-check:
    name: Docs updated with code
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require docs or changelog changes when code changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed files:"; echo "$changed"
          code=$(echo "$changed" | grep -E '^(crates/|Cargo\.toml$)' || true)
          docs=$(echo "$changed" | grep -E '^(docs/|CHANGELOG\.md$|README\.md$|CLAUDE\.md$)' || true)
          if [ -n "$code" ] && [ -z "$docs" ]; then
            echo "::error::Code changed but no documentation or CHANGELOG update was found. Update docs/ and CHANGELOG.md (see CLAUDE.md §4), or add the 'no-docs' label if truly not needed."
            exit 1
          fi
          echo "Docs check passed."
